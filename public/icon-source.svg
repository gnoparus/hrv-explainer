<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="8%" r="70%">
      <stop offset="0%" stop-color="#2fe7c9" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#2fe7c9" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="#05080b" />
  <rect width="512" height="512" rx="104" fill="url(#glow)" />

  <!-- Heart outline, faceted/geometric (low-poly, straight segments) like the reference image -->
  <polygon
    points="50,95 15,55 0,35 5,10 25,0 50,20 75,0 95,10 100,35 85,55"
    transform="translate(76 90) scale(3.6 3.6)"
    fill="none"
    stroke="#2fe7c9"
    stroke-width="3.9"
    stroke-linejoin="round"
    opacity="0.9"
    filter="url(#softGlow)"
  />

  <!-- Secondary trace: signal-violet, offset behind/below as an echo -->
  <polyline
    points="76,306 176,306 206,246 236,346 266,286 296,306 436,306"
    fill="none"
    stroke="#b18bff"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.55"
    filter="url(#softGlow)"
  />

  <!-- Primary trace: signal-teal QRS spike -->
  <polyline
    points="66,256 176,256 216,166 256,346 296,206 326,256 446,256"
    fill="none"
    stroke="#2fe7c9"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#softGlow)"
  />
</svg>
