<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Full-bleed background, no corner rounding; the OS applies its own mask shape -->
  <rect width="512" height="512" fill="#05080b" />

  <!-- Heart + trace, scaled down and centered to stay inside the roughly-80% maskable safe zone -->
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <path
      d="M12,21 C12,21 3,14.5 3,8.5 C3,5.5 5.5,3 8.5,3 C10,3 11.3,3.8 12,5 C12.7,3.8 14,3 15.5,3 C18.5,3 21,5.5 21,8.5 C21,14.5 12,21 12,21 Z"
      transform="translate(16 30) scale(20 20)"
      fill="none"
      stroke="#2fe7c9"
      stroke-width="0.7"
      stroke-linejoin="round"
      opacity="0.9"
      filter="url(#softGlow)"
    />
    <polyline
      points="76,306 176,306 206,246 236,346 266,286 296,306 436,306"
      fill="none"
      stroke="#b18bff"
      stroke-width="12"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.55"
      filter="url(#softGlow)"
    />
    <polyline
      points="66,256 176,256 216,166 256,346 296,206 326,256 446,256"
      fill="none"
      stroke="#2fe7c9"
      stroke-width="16"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#softGlow)"
    />
  </g>
</svg>
